# Connection multiplexing + keepalives for every host.
#
# Without this, anything that polls a box over ssh pays a full login per call:
# TCP handshake, key exchange, PAM, logind session, pam_systemd, the lot. The
# herdr-dash ops board polls `herdr api snapshot` on the homelab every 6s, and
# unmultiplexed that was ~13.8k logins/day — 77% of everything in that box's
# journal, cutting its retention from weeks to 8 days.
#
# With ControlMaster the first ssh opens a real connection and every later one
# rides it as a new channel: no login, no journal line, and a few ms instead of
# a few hundred. ControlPersist keeps the master alive between polls; %C hashes
# host/port/user into a short socket name so the path stays under the unix
# socket length limit.
#
# Host-specific settings (hostnames, IPs, identity files) belong in the
# untracked ~/.ssh/config, not here — this repo is public.
Host *
  ControlMaster auto
  ControlPath ~/.ssh/cm-%C
  ControlPersist 10m
  # Drop dead masters rather than letting a poller hang on a stale socket
  # (Tailscale/NAT idle timeouts, laptop sleep, homelab reboot).
  ServerAliveInterval 30
  ServerAliveCountMax 3
