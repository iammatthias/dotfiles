# ~/.config/herdr/config.toml — agent dashboard, tuned for the Ghostty visor
# Reload live with: herdr server reload-config   (or prefix+shift+r inside herdr)

onboarding = false

[theme]
# "terminal" inherits the outer terminal's palette — the CRT layer in Ghostty
# (~/.config/ghostty/config.retro) restyles herdr's whole UI automatically.
name = "terminal"

[theme.custom]
# Amber phosphor accent for highlights, borders, and navigation UI —
# matches the Ghostty amber layer (dotfiles/ghostty/config.retro)
accent = "#ffb000"

[terminal]
# New panes/tabs/splits inherit the CWD of the pane they came from,
# so agent worktree panes stay rooted in the right repo.
new_cwd = "follow"

[worktrees]
# Where prefix+shift+g (new worktree) creates git worktrees for agent runs
directory = "~/.herdr/worktrees"

# No custom keybindings: the whole workflow is mouse-driven — tap agents and
# workspaces in the sidebar (the "ops" workspace holds herdr-dash, "homelab"
# holds the remote attach). herdr's stock Ctrl+b prefix layer still exists
# but nothing here depends on it.

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"      # agents needing input float to the top
sidebar_width = 30
sidebar_max_width = 40
hide_tab_bar_when_single_tab = true

[ui.sidebar.agents]
row_gap = 0
rows = [
  [{ token = "state_icon" }, { token = "agent", bold = true }, { token = "workspace", dim = true }],
  [{ token = "state_text", dim = true }],
]

# Claude rows show the live terminal title = what the agent is doing right now
[ui.sidebar.agents.rows_by_agent]
claude = [
  [{ token = "state_icon" }, { token = "agent", bold = true }, { token = "workspace", dim = true }],
  [{ token = "terminal_title_stripped" }],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  [{ token = "state_icon" }, { token = "workspace", bold = true }],
  [{ token = "branch" }, { token = "git_status", dim = true }],
]

[ui.toast]
delivery = "system"

[session]
# Claude/codex panes resume their native conversation sessions after a
# herdr server restart (requires the official integrations, installed)
resume_agents_on_restore = true

[remote]
# herdr adds SSH keepalives + connection reuse for --remote; survives
# Tailscale/NAT idle timeouts without touching your ~/.ssh/config
manage_ssh_config = true

[experimental]
allow_nested = true   # lets a pane host `herdr --remote homelab.local`
pane_history = true   # pane scrollback survives full server restarts
